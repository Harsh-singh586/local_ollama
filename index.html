<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local PDF RAG - Document Manager & Q&A</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 700px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab-btn {
            padding: 10px 20px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-btn:hover {
            color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        .file-upload-area {
            border: 2px dashed #667eea;
            border-radius: 5px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #f8f9ff;
        }

        .file-upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }

        .file-upload-area.dragover {
            border-color: #764ba2;
            background: #e8ebff;
        }

        .file-upload-area input[type="file"] {
            display: none;
        }

        .upload-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .upload-text {
            color: #667eea;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .upload-subtext {
            color: #999;
            font-size: 12px;
        }

        textarea {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 14px;
            resize: vertical;
            min-height: 80px;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-size: 14px;
            align-self: flex-end;
            height: fit-content;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .answer-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #e0e0e0;
        }

        .answer-box {
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            padding: 15px;
            min-height: 100px;
            color: #333;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .answer-box.empty {
            color: #999;
            font-style: italic;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            margin-top: 10px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #e0e0e0;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }

        .error.active {
            display: block;
        }

        .success {
            color: #27ae60;
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }

        .success.active {
            display: block;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 24px;
            }

            .input-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 PDF RAG Manager</h1>
        <p class="subtitle">Upload documents and ask questions</p>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="upload">📤 Upload Document</button>
            <button class="tab-btn" data-tab="qa">❓ Ask Questions</button>
        </div>

        <!-- Upload Tab -->
        <div class="tab-content active" id="upload-tab">
            <div class="form-group">
                <label>Select PDF Document:</label>
                <div class="file-upload-area" id="uploadArea">
                    <div class="upload-icon">📄</div>
                    <div class="upload-text">Click to upload or drag and drop</div>
                    <div class="upload-subtext">PDF files only</div>
                    <input type="file" id="fileInput" accept=".pdf" />
                </div>
                <div class="error" id="uploadError"></div>
                <div class="success" id="uploadSuccess"></div>
            </div>

            <div class="loading" id="uploadLoading">
                <div class="spinner"></div>
                <p>Uploading and indexing document...</p>
            </div>
        </div>

        <!-- Q&A Tab -->
        <div class="tab-content" id="qa-tab">
            <form id="qaForm">
                <div class="form-group">
                    <label for="question">Your Question:</label>
                    <div class="input-group">
                        <textarea 
                            id="question" 
                            placeholder="Ask a question about the documents..."
                            required
                        ></textarea>
                        <button type="submit" id="askBtn">Ask</button>
                    </div>
                    <div class="error" id="questionError"></div>
                </div>
            </form>

            <div class="loading" id="qaLoading">
                <div class="spinner"></div>
                <p>Searching documents and generating answer...</p>
            </div>

            <div class="answer-section">
                <label for="answer">Answer:</label>
                <div class="answer-box empty" id="answer">
                    Answers will appear here...
                </div>
                <div class="error" id="answerError"></div>
                <div class="success" id="qaSuccess"></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5001';

        // Tab switching
        const tabButtons = document.querySelectorAll('.tab-btn');
        const tabContents = document.querySelectorAll('.tab-content');

        tabButtons.forEach(button => {
            button.addEventListener('click', () => {
                const tabName = button.dataset.tab;
                
                // Remove active class from all buttons and contents
                tabButtons.forEach(btn => btn.classList.remove('active'));
                tabContents.forEach(content => content.classList.remove('active'));
                
                // Add active class to clicked button and corresponding content
                button.classList.add('active');
                document.getElementById(`${tabName}-tab`).classList.add('active');
            });
        });

        // Upload functionality
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const uploadError = document.getElementById('uploadError');
        const uploadSuccess = document.getElementById('uploadSuccess');
        const uploadLoading = document.getElementById('uploadLoading');

        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                fileInput.files = files;
                handleFileUpload(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFileUpload(e.target.files[0]);
            }
        });

        async function handleFileUpload(file) {
            if (!file.type.includes('pdf')) {
                showUploadError('Please upload a PDF file');
                return;
            }

            clearUploadMessages();
            uploadLoading.classList.add('active');

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch(`${API_URL}/upload`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`API Error: ${response.status} ${response.statusText}`);
                }

                const data = await response.json();
                showUploadSuccess(`✓ Document "${file.name}" uploaded and indexed successfully!`);
                fileInput.value = '';

            } catch (error) {
                console.error('Error:', error);
                showUploadError(`Error uploading file: ${error.message}`);
                
                if (error.message.includes('Failed to fetch')) {
                    showUploadError('Cannot connect to API. Make sure the server is running on http://localhost:5001');
                }
            } finally {
                uploadLoading.classList.remove('active');
            }
        }

        // Q&A functionality
        const qaForm = document.getElementById('qaForm');
        const questionInput = document.getElementById('question');
        const answerBox = document.getElementById('answer');
        const qaLoading = document.getElementById('qaLoading');
        const questionError = document.getElementById('questionError');
        const answerError = document.getElementById('answerError');
        const qaSuccess = document.getElementById('qaSuccess');
        const askBtn = document.getElementById('askBtn');

        qaForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const question = questionInput.value.trim();

            if (!question) {
                showQAError('Please enter a question', 'question');
                return;
            }

            // Clear previous messages
            clearQAMessages();

            // Show loading state
            qaLoading.classList.add('active');
            askBtn.disabled = true;

            try {
                const response = await fetch(`${API_URL}/ask`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        question: question
                    })
                });

                if (!response.ok) {
                    throw new Error(`API Error: ${response.status} ${response.statusText}`);
                }

                const data = await response.json();

                // Display answer
                if (data.answer) {
                    answerBox.textContent = data.answer;
                    answerBox.classList.remove('empty');
                    showQASuccess('Answer generated successfully!');
                } else {
                    showQAError('No answer received from the API', 'answer');
                }

            } catch (error) {
                console.error('Error:', error);
                showQAError(`Error: ${error.message}`, 'answer');
                
                // Check if server is running
                if (error.message.includes('Failed to fetch')) {
                    showQAError('Cannot connect to API. Make sure the server is running on http://localhost:5001', 'answer');
                }
            } finally {
                qaLoading.classList.remove('active');
                askBtn.disabled = false;
            }
        });

        // Upload helper functions
        function showUploadError(message) {
            uploadError.textContent = message;
            uploadError.classList.add('active');
        }

        function showUploadSuccess(message) {
            uploadSuccess.textContent = message;
            uploadSuccess.classList.add('active');
            setTimeout(() => {
                uploadSuccess.classList.remove('active');
            }, 3000);
        }

        function clearUploadMessages() {
            uploadError.classList.remove('active');
            uploadSuccess.classList.remove('active');
        }

        // Q&A helper functions
        function showQAError(message, target) {
            const errorElement = target === 'question' ? questionError : answerError;
            errorElement.textContent = message;
            errorElement.classList.add('active');
        }

        function showQASuccess(message) {
            qaSuccess.textContent = message;
            qaSuccess.classList.add('active');
            setTimeout(() => {
                qaSuccess.classList.remove('active');
            }, 3000);
        }

        function clearQAMessages() {
            questionError.classList.remove('active');
            answerError.classList.remove('active');
            qaSuccess.classList.remove('active');
        }

        // Clear question error when user starts typing
        questionInput.addEventListener('input', () => {
            questionError.classList.remove('active');
        });
    </script>
</body>
</html>
